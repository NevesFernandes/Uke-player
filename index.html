<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111418">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Uke player</title>
<style>
  :root { --bg:#111418; --fg:#e8e6df; --dim:#7d848c; --chord:#ffb454; --tab:#8fbf9f; --line:#242a31; --accent:#ffb454; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family: system-ui, sans-serif; }
  button, input { font: inherit; color: inherit; }
  .hidden { display:none !important; }

  /* list view */
  #list { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  #list h1 { font-size: 20px; margin: 4px 0 12px; }
  #search { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#181c21; }
  .song { display:block; width:100%; text-align:left; padding:14px 6px; border:0; border-bottom:1px solid var(--line); background:none; }
  .song small { display:block; color:var(--dim); margin-top:2px; }
  #meta { color:var(--dim); font-size:12px; margin-top:18px; }

  /* player view */
  #player { padding: 0 0 120px; }
  #topbar { position: sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 12px; background:rgba(17,20,24,.96); border-bottom:1px solid var(--line); }
  #topbar .t { flex:1; min-width:0; }
  #topbar .t b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #topbar .t span { color:var(--dim); font-size:12px; }
  .btn { min-width:44px; height:44px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:#181c21; }
  .btn.on { background:var(--accent); color:#111; border-color:var(--accent); }
  #warn { margin:8px 12px 0; padding:8px 10px; border-radius:8px; background:#3a2a12; color:#ffd9a0; font-size:12px; }
  #song { margin:0; padding:16px 14px 40vh; white-space:pre; overflow-x:auto; line-height:1.35;
          font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size:16px; }
  .c { color:var(--chord); font-weight:700; }
  .tb { color:var(--tab); }
  .d { color:var(--dim); }
  #controls { position:fixed; left:0; right:0; bottom:0; z-index:6; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
              background:rgba(17,20,24,.97); border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #controls .grp { display:flex; align-items:center; gap:6px; }
  #controls .lbl { color:var(--dim); font-size:12px; min-width:34px; text-align:center; }
  #play { min-width:64px; font-weight:700; }
  .btn.rec.on { background:#e5484d; border-color:#e5484d; color:#fff; }
</style>
</head>
<body>

<div id="list">
  <h1>🎶 Uke player</h1>
  <input id="search" type="search" placeholder="Search songs…" autocomplete="off">
  <div id="songs"></div>
  <div id="meta"></div>
</div>

<div id="player" class="hidden">
  <div id="topbar">
    <button class="btn" id="back" aria-label="Back to list">←</button>
    <div class="t"><b id="ptitle"></b><span id="partist"></span></div>
    <button class="btn" id="wake" title="Keep screen on">☀</button>
  </div>
  <div id="warn" class="hidden"></div>
  <pre id="song"></pre>
  <div id="controls">
    <div class="grp">
      <button class="btn" id="tdown">♭</button>
      <span class="lbl" id="tval">0</span>
      <button class="btn" id="tup">♯</button>
    </div>
    <div class="grp">
      <button class="btn" id="sdown">−</button>
      <button class="btn" id="play">▶</button>
      <button class="btn" id="sup">+</button>
      <span class="lbl" id="sval"></span>
    </div>
    <div class="grp">
      <button class="btn" id="fdown">A−</button>
      <button class="btn" id="fup">A+</button>
    </div>
    <div class="grp">
      <button class="btn rec" id="rec" title="Record pace: play and drag the text to where you are">●</button>
      <button class="btn hidden" id="clr" title="Delete recorded pace">🗑</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
               set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

  let DATA = null, cur = null, st = null;           // st = per-song settings {shift, speed, font}
  let rec = false, recBuf = [], track = null, playT = 0, recT = 0, sampleAcc = 0;
  let playing = false, pos = 0, last = 0, lastSet = 0, raf = 0, wakeLock = null, wakeWanted = LS.get('wake', false);

  // ---------- chord detection / highlighting ----------
  const CHORD = /^[A-G](#|b)?(maj|min|dim|aug|sus|add|m|M)?\d*(sus\d?|add\d+)?(\/[A-G](#|b)?)?$/;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const isTab = l => /^\s*[AECGaecg]\|/.test(l);
  function isChordLine(l) {
    const toks = l.trim().split(/\s+/).filter(Boolean);
    if (!toks.length) return false;
    let chords = 0, other = 0;
    for (const t of toks) {
      if (CHORD.test(t)) chords++;
      else if (/^\(?x\d+\)?$/i.test(t) || /^N\.?C\.?$/i.test(t) || /^[|:\-–]+$/.test(t)) continue;
      else other++;
    }
    return chords > 0 && other === 0;
  }
  function renderLine(l) {
    if (isTab(l)) return `<span class="tb">${esc(l)}</span>`;
    if (/^\s*(\[[^\]]*\]|#[^\n]*)\s*$/.test(l) && !/^\s*\[[A-G]/.test(l)) return `<span class="d">${esc(l)}</span>`; // [Riff], [Intro], comments
    if (isChordLine(l)) return l.replace(/(\S+)/g, m => CHORD.test(m) ? `<span class="c">${esc(m)}</span>` : esc(m));
    // intro-style "Intro: G F C" and inline chords like [Am] or "[A][D][E7]"
    let out = esc(l).replace(/\[([A-G][^\]\s]*)\]/g, (m, c) => CHORD.test(c) ? `[<span class="c">${c}</span>]` : m);
    out = out.replace(/^(\s*[A-Za-zÀ-ÿ# ]+:\s+)((?:\S+\s*)+)$/, (m, a, b) => {
      const toks = b.trim().split(/\s+/);
      return toks.every(t => CHORD.test(t) || /^\(?x\d+\)?$/i.test(t))
        ? a + b.replace(/(\S+)/g, t => CHORD.test(t) ? `<span class="c">${t}</span>` : t) : m;
    });
    return out;
  }

  // ---------- list ----------
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function drawList() {
    const q = norm($('search').value.trim());
    const box = $('songs'); box.innerHTML = '';
    DATA.songs.filter(s => !q || norm(s.title + ' ' + s.artist).includes(q)).forEach(s => {
      const b = document.createElement('button'); b.className = 'song';
      b.innerHTML = `${esc(s.title)}<small>${esc(s.artist)}</small>`;
      b.onclick = () => { location.hash = '#' + s.id; };
      box.appendChild(b);
    });
  }

  // ---------- player ----------
  function saveSt() { LS.set('song:' + cur.id, st); }
  function drawSong() {
    const text = cur.shifts[String(st.shift)] ?? cur.shifts['0'];
    $('song').innerHTML = text.split('\n').map(renderLine).join('\n');
    $('song').style.fontSize = st.font + 'px';
    $('tval').textContent = (st.shift > 0 ? '+' : '') + st.shift;
    $('sval').textContent = (track && !rec) ? st.rate.toFixed(2) + '×' : st.speed;
    $('rec').classList.toggle('on', rec);
    $('clr').classList.toggle('hidden', !track);
    const w = (cur.warnings[String(st.shift)] || []).filter(x => !x.includes('chord line'));
    $('warn').classList.toggle('hidden', !w.length);
    $('warn').textContent = w.length ? '⚠ ' + w.join(' · ') : '';
  }
  function openSong(id) {
    const s = DATA.songs.find(x => x.id === id);
    if (!s) { showList(); return; }
    stop(); rec = false; recBuf = [];
    cur = s; st = Object.assign({ shift: 0, speed: 20, font: 16, rate: 1 }, LS.get('song:' + id, {}));
    track = LS.get('track:' + id, null);
    $('ptitle').textContent = s.title; $('partist').textContent = s.artist;
    $('list').classList.add('hidden'); $('player').classList.remove('hidden');
    window.scrollTo(0, 0); drawSong();
  }
  function showList() { stop(); cur = null; $('player').classList.add('hidden'); $('list').classList.remove('hidden'); }

  // ---------- auto-scroll ----------
  const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
  function trackAt(tm) {                                   // scroll fraction at track time tm
    const a = track; if (tm <= a[0][0]) return a[0][1];
    for (let i = 1; i < a.length; i++) if (a[i][0] >= tm) {
      const [t0, y0] = a[i - 1], [t1, y1] = a[i]; return t1 === t0 ? y1 : y0 + (y1 - y0) * (tm - t0) / (t1 - t0);
    }
    return a[a.length - 1][1];
  }
  function trackTimeFor(f, from) {                         // track time whose position best matches fraction f
    const dur = track[track.length - 1][0] || 1; let best = 0, bs = 1e9;
    for (const [t, y] of track) { const sc = Math.abs(y - f) + 0.15 * Math.abs(t - from) / dur; if (sc < bs) { bs = sc; best = t; } }
    return best;
  }
  function finishRec() {
    rec = false;
    if (recBuf.length >= 20) {                             // at least ~2 s
      let m = 0; track = recBuf.map(([t, y]) => { m = Math.max(m, y); return [t, m]; });   // never replay backwards
      LS.set('track:' + cur.id, track);
    }
    recBuf = []; drawSong();
  }
  function frame(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    const max = maxScroll(), manual = Math.abs(window.scrollY - lastSet) > 3;
    if (track && !rec) {
      if (manual) playT = trackTimeFor(window.scrollY / max, playT);          // you dragged: re-sync to that spot
      playT += dt * st.rate;
      if (playT >= track[track.length - 1][0]) { stop(); return; }
      const y = trackAt(playT) * max; lastSet = y; window.scrollTo(0, y);
    } else {
      if (manual) pos = window.scrollY;
      pos += st.speed * dt; lastSet = pos; window.scrollTo(0, pos);
      if (rec) {
        recT += dt; sampleAcc += dt;
        if (sampleAcc >= 0.1) { sampleAcc = 0; recBuf.push([+recT.toFixed(2), +(window.scrollY / max).toFixed(4)]); }
      }
      if (pos >= max - 1) { stop(); return; }
    }
    raf = requestAnimationFrame(frame);
  }
  async function setWake(on) {
    try {
      if (on && 'wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch {}
  }
  function start() {
    playing = true; pos = lastSet = window.scrollY; last = performance.now();
    if (rec) { recBuf = [[0, +(window.scrollY / maxScroll()).toFixed(4)]]; recT = 0; sampleAcc = 0; }
    else if (track) playT = trackTimeFor(window.scrollY / maxScroll(), 0);
    $('play').textContent = '⏸'; $('play').classList.add('on'); raf = requestAnimationFrame(frame); if (wakeWanted) setWake(true); }
  function stop() { const wasRec = rec && playing; playing = false; cancelAnimationFrame(raf); if (wasRec) finishRec(); $('play').textContent = '▶'; $('play').classList.remove('on'); if (!wakeWanted) setWake(false); }
  function toggle() { playing ? stop() : start(); }

  // ---------- wiring ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  $('back').onclick = () => { location.hash = ''; };
  $('play').onclick = toggle;
  $('song').onclick = toggle;                                   // tap the text to start/pause
  $('sdown').onclick = () => { if (track && !rec) st.rate = clamp(+(st.rate - 0.05).toFixed(2), 0.5, 2); else st.speed = clamp(st.speed - 2, 2, 150); saveSt(); drawSong(); };
  $('sup').onclick = () => { if (track && !rec) st.rate = clamp(+(st.rate + 0.05).toFixed(2), 0.5, 2); else st.speed = clamp(st.speed + 2, 2, 150); saveSt(); drawSong(); };
  $('rec').onclick = () => { if (playing) return; rec = !rec; drawSong(); };
  $('clr').onclick = () => { if (confirm('Delete the recorded pace for this song?')) { track = null; try { localStorage.removeItem('track:' + cur.id); } catch {} drawSong(); } };
  $('fdown').onclick = () => { st.font = clamp(st.font - 1, 10, 32); saveSt(); drawSong(); };
  $('fup').onclick = () => { st.font = clamp(st.font + 1, 10, 32); saveSt(); drawSong(); };
  $('tdown').onclick = () => { st.shift = clamp(st.shift - 1, DATA.min, DATA.max); saveSt(); drawSong(); };
  $('tup').onclick = () => { st.shift = clamp(st.shift + 1, DATA.min, DATA.max); saveSt(); drawSong(); };
  $('tval').onclick = () => { st.shift = 0; saveSt(); drawSong(); };   // tap the number to reset
  $('wake').classList.toggle('on', wakeWanted);
  $('wake').onclick = () => { wakeWanted = !wakeWanted; LS.set('wake', wakeWanted); $('wake').classList.toggle('on', wakeWanted); if (playing) setWake(wakeWanted); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && playing && wakeWanted) setWake(true); });
  document.addEventListener('keydown', e => {
    if (!cur) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowUp' && e.shiftKey) $('sup').click();
    else if (e.key === 'ArrowDown' && e.shiftKey) $('sdown').click();
  });
  $('search').oninput = drawList;
  addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); id ? openSong(id) : showList(); });

  fetch('songs.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
    DATA = d; drawList();
    $('meta').textContent = `${d.songs.length} songs · synced ${d.generated.replace('T', ' ').replace('+00:00', ' UTC')}`;
    const id = decodeURIComponent(location.hash.slice(1)); if (id) openSong(id);
  }).catch(() => { $('songs').textContent = 'Could not load songs.json'; });
})();
</script>
</body>
</html>
